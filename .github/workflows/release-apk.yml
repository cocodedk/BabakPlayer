name: Build signed release APK

# Manual only. The previous push-to-main trigger committed a version bump to a
# branch-protected main and then tried to push it -- that push was always rejected,
# which orphaned the tag on every run (see git history around 2026-09). The version
# now comes from the latest v* tag instead, so nothing needs to be committed.
on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize rather than cancel: the next version is derived from the newest tag, so two
# concurrent runs would both read the same one and try to release the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # shallow clones hide tags, and the version comes from them

      - name: Check signing secrets are present
        # Through env, not ${{ }}: interpolation splices the secret's *value* into the
        # shell source, so a password containing $ or a backtick would be expanded
        # before the test ran and report itself missing when it is set.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            exit 1
          fi

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compute next version
        id: version
        run: |
          # --sort=-version:refname, because a lexical sort puts v9 above v10.
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -1)
          [ -z "$LATEST" ] && LATEST="v0"
          VERSION="${LATEST#v}"
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "Cannot parse tag as a plain integer: $LATEST" >&2; exit 1; }
          NEXT=$((VERSION + 1))
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Decode and verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          # Gradle decides at *configuration* time whether a signing config exists, so a
          # corrupt keystore is not an error there -- it silently produces an unsigned
          # APK and the staging step below then dies with "cp: cannot stat", minutes
          # later and nowhere near the cause. This covers the file, the store password
          # and the alias. It deliberately does not pass -keypass: the keystore is
          # PKCS12, which has no separate key password, and keytool ignores the flag
          # with a warning. The apksigner step below is what actually proves the
          # signature.
          keytool -list -keystore release.keystore -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Build signed release APKs (full and foss)
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFullRelease assembleFossRelease --no-daemon

      - name: Stage the APKs under stable filenames
        run: |
          # Fixed names are what make releases/latest/download/BabakPlayer.apk and
          # .../BabakPlayer-foss.apk work.
          cp app/build/outputs/apk/full/release/app-full-release.apk BabakPlayer.apk
          cp app/build/outputs/apk/foss/release/app-foss-release.apk BabakPlayer-foss.apk
          ls -la BabakPlayer.apk BabakPlayer-foss.apk

      - name: Verify both APKs are signed
        run: |
          # The check that proves what we are about to publish. An unsigned APK uploads
          # exactly as cleanly as a signed one, so assert it rather than infer it from a
          # green build. This also covers the one fault the keystore pre-flight cannot
          # see, a key password that does not match the store password.
          APKSIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found in the Android SDK" >&2; exit 1; }
          "$APKSIGNER" verify --print-certs BabakPlayer.apk
          "$APKSIGNER" verify --print-certs BabakPlayer-foss.apk

      - name: Remove keystore from the runner
        if: always()
        run: rm -f release.keystore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BabakPlayer-${{ steps.version.outputs.tag }}
          path: |
            BabakPlayer.apk
            BabakPlayer-foss.apk

      # This step creates the tag as well as the release. Pushing the tag ourselves
      # first would mean a failure here left the tag behind with no release attached,
      # and the next run would compute the following version -- burning that number
      # for good. Nothing here commits to main; the version lives only in the tag.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Without this the tag lands on whatever the default branch points at when
          # the API call runs, which is not necessarily the commit whose APKs are
          # attached.
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            BabakPlayer.apk
            BabakPlayer-foss.apk
